# PROD profile: connect to a real MongoDB (Atlas free tier, local, or Docker).
# Provide the connection string via the MONGODB_URI environment variable.
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/smartpark}
  # Disable the embedded Mongo autoconfiguration in production.
  autoconfigure:
    exclude:
      - de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration

smartpark:
  simulator:
    enabled: ${SMARTPARK_SIM_ENABLED:true}

# The platform health check (Render's /actuator/health) should report whether
# the web server is up, not gate the whole deploy on a live MongoDB ping — a
# brief DB blip must not mark a healthy instance as failed. Mongo connectivity
# is still used by the app and surfaced under /actuator/health/mongo if needed.
management:
  health:
    mongo:
      enabled: false
