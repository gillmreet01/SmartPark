# Render.com Blueprint — deploys SmartPark as two services:
#   1. smartpark-api  : Spring Boot backend (Docker)
#   2. smartpark-web  : React static site
#
# MongoDB is external (MongoDB Atlas free tier). After the first deploy, fill in
# the `sync: false` values in the Render dashboard — see DEPLOY.md for the flow.
services:
  # --- Backend API (Spring Boot, Docker) ---
  - type: web
    name: smartpark-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Your MongoDB Atlas connection string (mongodb+srv://...). Set in dashboard.
      - key: MONGODB_URI
        sync: false
      # Comma-separated allowed origins — set to your smartpark-web URL after deploy.
      - key: SMARTPARK_CORS_ORIGINS
        sync: false
      # A strong JWT signing secret is generated for you.
      - key: SMARTPARK_JWT_SECRET
        generateValue: true
      # Override the seeded admin password for a public deploy.
      - key: SMARTPARK_ADMIN_PASS
        sync: false

  # --- Frontend (React static site) ---
  - type: web
    name: smartpark-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Backend origin for API + WebSocket — set to your smartpark-api URL after deploy.
    envVars:
      - key: VITE_API_BASE
        sync: false
    # SPA fallback so client-side routes resolve.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
